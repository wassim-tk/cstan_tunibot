# Nav2 params for EXPLORING while slam_toolbox builds the map (no map_server, no AMCL).
# Derived from Wassim's nav2_params.yaml (not edited). Every node that Jazzy's
# nav2_bringup navigation_launch.py starts has a section here:
#   controller_server, smoother_server, planner_server, route_server, behavior_server,
#   velocity_smoother, collision_monitor, bt_navigator, waypoint_follower, docking_server.
# Speed limits (gentle, for good SLAM): linear 0.25 m/s, angular 0.5 rad/s, everywhere.
# Lines marked "# CHANGED" differ from Wassim's file.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000            # CHANGED: Jazzy default
    action_server_result_timeout: 900.0       # CHANGED: Jazzy default
    navigators: ["navigate_to_pose", "navigate_through_poses"]   # CHANGED: Jazzy default
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    enable_groot_monitoring: False            # CHANGED: no Groot, saves a bit of RAM

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30              # CHANGED: Jazzy default
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]   # CHANGED: Jazzy name is plural
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3           # CHANGED: robot is slower now (was 0.5)
      movement_time_allowance: 15.0           # CHANGED: more time at low speed (was 10)

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False         # CHANGED: less logging/CPU
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25                         # CHANGED: gentle (was 0.5)
      max_vel_y: 0.0
      max_vel_theta: 0.5                      # CHANGED: gentle (was 1.0)
      min_speed_xy: 0.0
      max_speed_xy: 0.25                      # CHANGED
      min_speed_theta: 0.0
      acc_lim_x: 1.0                          # CHANGED: softer accel (was 2.5)
      acc_lim_y: 0.0
      acc_lim_theta: 1.5                      # CHANGED (was 3.2)
      decel_lim_x: -1.0                       # CHANGED (was -2.5)
      decel_lim_y: 0.0
      decel_lim_theta: -1.5                   # CHANGED (was -3.2)
      vx_samples: 20
      vy_samples: 1                           # CHANGED: robot cannot move sideways
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1             # CHANGED: must be below the new max speed (was 0.25)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

smoother_server:                              # CHANGED: new, Wassim's file has none
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true                     # plan through unknown cells (frontiers sit next to them)

route_server:                                 # CHANGED: new. Not used for exploring, but it is
  ros__parameters:                            # in navigation_launch.py's lifecycle list, so it
    use_sim_time: True                        # must configure or the whole Nav2 bring-up stops.
    graph_filepath: "$(find-pkg-share nav2_route)/graphs/sample_graph.geojson"   # dummy graph
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

behavior_server:
  ros__parameters:
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_costmap_topic: local_costmap/costmap_raw   # CHANGED: Jazzy names (replace costmap_topic / footprint_topic)
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5                   # CHANGED: gentle (was 1.0)
    min_rotational_vel: 0.2                   # CHANGED (was 0.4)
    rotational_acc_lim: 1.5                   # CHANGED (was 3.2)

waypoint_follower:                            # CHANGED: new, Wassim's file has none
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map                       # the map slam_toolbox is building
      robot_base_frame: base_footprint
      use_sim_time: True
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True   # slam_toolbox publishes /map as transient_local
        subscribe_to_updates: True            # CHANGED: follow the growing map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False              # CHANGED: nobody views it, saves CPU/RAM
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 0.5]            # CHANGED: gentle (was 0.5, 2.0)
    min_velocity: [-0.25, 0.0, -0.5]          # CHANGED
    max_accel: [1.0, 0.0, 1.5]                # CHANGED (was 2.5, 3.2)
    max_decel: [-1.0, 0.0, -1.5]              # CHANGED (was -2.5, -3.2)
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.2
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
      min_height: 0.05
      max_height: 2.0

# Docking is not used while exploring. It is kept because navigation_launch.py lists
# docking_server as a lifecycle node, so it must configure cleanly (step 7 will use it).
docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_prestaging_tolerance: 0.5
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"                   # same as Wassim's (base_link exists in our URDF)
    fixed_frame: "odom"
    dock_backwards: false
    dock_approach_timeout: 30.0
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_battery_status: false
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.1                       # CHANGED: below the new max speed (was 0.15)
      v_linear_max: 0.15
