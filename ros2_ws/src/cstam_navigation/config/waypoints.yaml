# Named locations for the delivery robot, in the `map` frame.
#
# The saved map is anchored in the Gazebo world frame, so these coordinates are
# world coordinates. Each table pose is the serving spot at the table's east
# end (1.3 m from its centre, in the aisle), facing the table (yaw = pi).
#
#   dock     : charging pad (must match docking_server.home_dock in nav2_params.yaml)
#   kitchen  : pickup point in front of the kitchen pass-through window
frame_id: map

